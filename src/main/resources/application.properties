spring.application.name=employee-management-system

# ---- Database (MySQL). The password is NOT stored here, see application-local.properties ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_web?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates and updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Security ----
# Change this secret before putting the app online (at least 32 characters)
app.jwt.secret=${JWT_SECRET:development-only-secret-change-me-0123456789}
app.jwt.expiration-minutes=480
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Adds 5 sample employees when the table is empty
app.seed-sample-data=true

# Your private settings (MySQL password) live in application-local.properties next to this file.
# That file is ignored by Git, so it is never uploaded to GitHub.
spring.config.import=optional:classpath:application-local.properties
